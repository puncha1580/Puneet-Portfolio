<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composing an Email Correctly | Interactive Learning</title>
<style>
:root{
  --ink:#182230; --muted:#586779; --line:#d8e0e8; --paper:#ffffff;
  --canvas:#f3f6fa; --brand:#174ea6; --brand-dark:#123d82;
  --soft:#eaf1ff; --good:#176b42; --good-bg:#e9f7ef;
  --bad:#9f2d2d; --bad-bg:#fff0f0; --focus:#f5b700;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:1060px;margin:0 auto;min-height:100vh;padding:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.brand{font-weight:700;letter-spacing:.01em}
.pill{font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#fff}
.progress-wrap{height:7px;background:#e0e7ef;border-radius:8px;overflow:hidden;margin:0 0 22px}
.progress{height:100%;width:10%;background:var(--brand);transition:width .2s ease}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.nav{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:12px}
.nav h2{font-size:.9rem;margin:4px 8px 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nav button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);margin:2px 0}
.nav button[aria-current="step"]{background:var(--soft);color:var(--brand-dark);font-weight:700}
.nav .num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;border:1px solid var(--line);font-size:.8rem;flex:none;background:#fff}
.nav button[aria-current="step"] .num{border-color:var(--brand);background:var(--brand);color:#fff}
main{min-width:0}
.screen{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,38px);min-height:600px;box-shadow:0 6px 24px rgba(23,44,73,.05)}
.eyebrow{font-size:.82rem;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
h1{font-size:clamp(1.7rem,3vw,2.35rem);line-height:1.18;margin:8px 0 14px}
h2{font-size:1.25rem;line-height:1.25;margin:24px 0 10px}
p{margin:0 0 14px}
.lead{font-size:1.08rem;color:#344255;max-width:68ch}
.note{border-left:4px solid var(--brand);background:#f2f6ff;padding:12px 15px;border-radius:0 8px 8px 0;margin:18px 0}
.caution{border-left-color:#b7791f;background:#fff8e7}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.card strong{display:block;margin-bottom:5px}
.icon{font-size:1.35rem;margin-bottom:8px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);border-radius:9px;padding:10px 16px;background:#fff;color:var(--ink);font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px;margin:13px 0}
label{font-weight:700}
input,textarea{width:100%;padding:10px 12px;border:1px solid #9aa8b7;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.hint{font-size:.9rem;color:var(--muted)}
.feedback{padding:11px 13px;border-radius:8px;margin-top:12px;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--good-bg);color:var(--good)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.mail-window{border:1px solid #cbd5e1;border-radius:12px;overflow:hidden;margin:18px 0;background:#fff}
.mail-top{background:#f7f9fc;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mail-top strong{font-size:.95rem}
.mail-fields{padding:4px 16px}
.mail-row{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f4}
.mail-row:last-child{border-bottom:0}
.mail-label{color:var(--muted);font-size:.92rem}
.mail-body{padding:16px;min-height:140px;border-top:1px solid var(--line);white-space:pre-wrap}
.fake-button{display:inline-block;border-radius:7px;padding:6px 11px;background:var(--brand);color:white;font-size:.88rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#fafbfd;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:9px 0}
.choice:hover{border-color:var(--brand)}
.choice[aria-pressed="true"]{border:2px solid var(--brand);background:var(--soft);padding:12px 14px}
.checklist{list-style:none;padding:0;margin:12px 0}
.checklist li{margin:9px 0}
.checklist label{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.checklist input{width:auto;margin-top:5px}
.scenario{background:#f7f9fc;border:1px solid var(--line);padding:15px;border-radius:10px;margin:15px 0}
.small{font-size:.88rem;color:var(--muted)}
.result{font-size:1.1rem;font-weight:700}
footer{font-size:.82rem;color:var(--muted);text-align:center;padding:18px}
@media(max-width:760px){
 .app{padding:12px}
 .layout{grid-template-columns:1fr}
 .nav{position:static}
 .nav ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:0;margin:0;list-style:none}
 .nav h2{margin-bottom:8px}
 .nav button{font-size:.86rem;padding:7px}
 .screen{min-height:0}
 .cards{grid-template-columns:1fr}
 .mail-row{grid-template-columns:72px 1fr}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Workplace Skills · Interactive Module</div>
    <div class="pill" id="screenCounter">Screen 1 of 10</div>
  </header>
  <div class="progress-wrap" aria-label="Course progress"><div class="progress" id="progress"></div></div>
  <div class="layout">
    <nav class="nav" aria-label="Module screens">
      <h2>Learning path</h2>
      <ol id="screenNav">
        <li><button data-screen="0" aria-current="step"><span class="num">1</span>Start here</button></li>
        <li><button data-screen="1"><span class="num">2</span>Email interface</button></li>
        <li><button data-screen="2"><span class="num">3</span>Demonstration</button></li>
        <li><button data-screen="3"><span class="num">4</span>Email structure</button></li>
        <li><button data-screen="4"><span class="num">5</span>Guided practice</button></li>
        <li><button data-screen="5"><span class="num">6</span>Spot the error</button></li>
        <li><button data-screen="6"><span class="num">7</span>Checklist</button></li>
        <li><button data-screen="7"><span class="num">8</span>Try it yourself</button></li>
        <li><button data-screen="8"><span class="num">9</span>Assessment</button></li>
        <li><button data-screen="9"><span class="num">10</span>Finish</button></li>
      </ol>
    </nav>
    <main>
      <article class="screen" id="screenContent" tabindex="-1" aria-live="polite"></article>
    </main>
  </div>
  <footer>Designed for keyboard, mouse, and touch input. Your answers stay in this browser session.</footer>
</div>
<script>
(function(){
const screens = [
`<div class="eyebrow">01 · Introduction</div>
<h1>Composing an Email Correctly</h1>
<p class="lead">A clear email helps the reader understand what you need, find the important details, and act without unnecessary back-and-forth.</p>
<div class="cards">
 <div class="card"><div class="icon" aria-hidden="true">◎</div><strong>Be clear</strong><span>Make the purpose easy to recognise.</span></div>
 <div class="card"><div class="icon" aria-hidden="true">▤</div><strong>Be complete</strong><span>Include the information the recipient needs.</span></div>
 <div class="card"><div class="icon" aria-hidden="true">✓</div><strong>Check before sending</strong><span>Review recipients, content, and any attachments.</span></div>
</div>
<div class="note"><strong>In this module:</strong> You will explore an email interface, review an example, practise composing a message, and check your understanding.</div>
<p class="small">Learning objective: compose a workplace email using the required fields and content conventions. Exact requirements must be verified against the applicable technical manual.</p>`,
`<div class="eyebrow">02 · Explore</div>
<h1>Know the email interface</h1>
<p class="lead">Select each item to learn what it is used for. The labels and placement may vary slightly between email applications.</p>
<div class="mail-window">
 <div class="mail-top"><strong>New message</strong><span class="small">Example interface</span></div>
 <div class="mail-fields">
  <button class="choice" data-info="to"><strong>To</strong> — who should receive the message?</button>
  <button class="choice" data-info="subject"><strong>Subject</strong> — what is the message about?</button>
  <button class="choice" data-info="body"><strong>Message body</strong> — what do you need to communicate?</button>
 </div>
 <div class="toolbar">
  <button class="choice" style="width:auto;margin:0;padding:6px 10px" data-info="attachment">📎 Attach file</button>
  <button class="choice" style="width:auto;margin:0;padding:6px 10px" data-info="send">Send</button>
 </div>
</div>
<div id="interfaceInfo" class="note" role="status">Choose an interface item above to reveal its purpose.</div>
<p class="small">Optional help: if you already know these controls, continue to the demonstration.</p>`,
`<div class="eyebrow">03 · Demonstration</div>
<h1>Watch the message take shape</h1>
<p class="lead">Follow the sequence below. Each step reveals one part of a sample email.</p>
<div class="mail-window">
 <div class="mail-top"><strong>New message</strong><span class="small" id="demoStep">Step 1 of 5</span></div>
 <div class="mail-fields" id="demoFields"></div>
 <div class="mail-body" id="demoBody">Start by identifying the intended recipient.</div>
 <div class="toolbar"><span>Demonstration only · fictional workplace example</span></div>
</div>
<div class="actions" style="border:0;padding-top:0;margin-top:14px">
 <button class="btn" id="demoBack" disabled>Previous step</button>
 <button class="btn primary" id="demoNext">Next step</button>
</div>
<div class="note">As you watch, notice how the recipient, subject, message, and attachment work together. The exact required order and formatting should be confirmed in the technical manual.</div>`,
`<div class="eyebrow">04 · Understand</div>
<h1>Recognise the parts of a complete email</h1>
<p class="lead">Here is a fictional example. Select a section to see what to check.</p>
<div class="mail-window">
 <div class="mail-top"><strong>Sample message</strong><span class="small">Illustrative only</span></div>
 <div class="mail-fields">
  <button class="choice" data-part="recipient"><strong>To:</strong> alex.morgan@example.com</button>
  <button class="choice" data-part="subject"><strong>Subject:</strong> Updated project schedule</button>
 </div>
 <button class="choice" style="margin:0;border-radius:0;border-left:0;border-right:0" data-part="body"><strong>Message:</strong><br>Hello Alex,<br><br>Please find the updated project schedule attached. Let me know if you have any questions.<br><br>Regards,<br>Sam</button>
 <div class="toolbar"><button class="choice" style="width:auto;margin:0;padding:6px 10px" data-part="attachment">📎 Project_schedule.xlsx</button></div>
</div>
<div id="partInfo" class="note" role="status">Select a section of the example.</div>
<div class="note caution"><strong>Important:</strong> This example demonstrates common email components. It is not a verified statement of the technical manual's exact requirements.</div>`,
`<div class="eyebrow">05 · Guided practice</div>
<h1>Compose a short workplace email</h1>
<p class="lead">A colleague has asked you to send the meeting notes. Fill in the fields below. This practice checks whether the core fields are present, not whether you have met an unverified technical specification.</p>
<div class="scenario"><strong>Scenario</strong><br>Send the meeting notes to Alex Morgan. Use a subject that identifies the notes and write a brief, polite message.</div>
<form id="practiceForm">
 <div class="field"><label for="recipient">To</label><input id="recipient" name="recipient" type="email" placeholder="name@example.com" autocomplete="email"><span class="hint">Enter a valid-looking email address.</span></div>
 <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" placeholder="A short, specific subject"></div>
 <div class="field"><label for="message">Message body</label><textarea id="message" name="message" placeholder="Write a short, polite message to your colleague."></textarea></div>
 <div class="field"><label for="attachment">Attachment status</label><select id="attachment" name="attachment" style="padding:10px;border:1px solid #9aa8b7;border-radius:8px"><option value="">Choose one</option><option value="attached">Meeting notes attached</option><option value="not-needed">No attachment needed</option><option value="forgotten">I have not checked</option></select></div>
 <button class="btn primary" type="submit">Check my draft</button>
</form>
<div id="practiceFeedback" class="feedback" role="status" aria-live="polite"></div>`,
`<div class="eyebrow">06 · Error recognition</div>
<h1>Spot the error before sending</h1>
<p class="lead">Read the situation and choose the best next action.</p>
<div class="scenario"><strong>Situation</strong><p style="margin:8px 0 0">Your email says, “Please see the attached report.” You are ready to send it, but you have not added a file.</p></div>
<div id="errorChoices">
 <button class="choice" data-answer="a">Send it now. The recipient can ask for the report later.</button>
 <button class="choice" data-answer="b">Stop, attach the correct report, and verify that it is included before sending.</button>
 <button class="choice" data-answer="c">Remove the sentence about the attachment, without checking whether the recipient needs the report.</button>
</div>
<div id="errorFeedback" class="feedback" role="status" aria-live="polite"></div>`,
`<div class="eyebrow">07 · Apply</div>
<h1>Use a final review checklist</h1>
<p class="lead">Before sending a workplace email, use this provisional checklist. Tick each item as you review your draft.</p>
<ul class="checklist">
 <li><label><input type="checkbox"> The recipient is correct and appropriate.</label></li>
 <li><label><input type="checkbox"> The subject describes the purpose of the email.</label></li>
 <li><label><input type="checkbox"> The message is complete, clear, and polite.</label></li>
 <li><label><input type="checkbox"> Names, dates, figures, and other details are accurate.</label></li>
 <li><label><input type="checkbox"> Any mentioned attachment is included and correct.</label></li>
 <li><label><input type="checkbox"> I have reviewed the message before sending.</label></li>
</ul>
<div id="checkProgress" class="note" role="status">0 of 6 checks completed.</div>
<div class="note caution"><strong>Manual verification pending:</strong> Replace or supplement this checklist with the exact requirements from the technical manual before release.</div>`,
`<div class="eyebrow">08 · Independent practice</div>
<h1>Your turn: send a project update</h1>
<p class="lead">Use what you have learned to plan a new message. You do not need to send a real email.</p>
<div class="scenario"><strong>Scenario</strong><br>Your team lead, Priya Shah, needs an update confirming that the draft guide is ready for review. You must tell her where the file is stored and ask for feedback by Friday.</div>
<form id="independentForm">
 <div class="field"><label for="indSubject">Subject</label><input id="indSubject" type="text" placeholder="Write a specific subject"></div>
 <div class="field"><label for="indBody">Message body</label><textarea id="indBody" placeholder="Draft your update to Priya. Include the file location and feedback deadline."></textarea></div>
 <button class="btn primary" type="submit">Review my draft</button>
</form>
<div id="indFeedback" class="feedback" role="status" aria-live="polite"></div>
<p class="small">This is a planning exercise. No message will be sent and no data will leave this page.</p>`,
`<div class="eyebrow">09 · Final assessment</div>
<h1>Check your understanding</h1>
<p class="lead">Answer the questions below. Each question is worth one point. A score of 3 out of 4 is the provisional pass mark for this sample module.</p>
<form id="assessmentForm">
 <fieldset style="border:0;padding:0;margin:16px 0"><legend><strong>1. What is the main purpose of a subject line?</strong></legend>
  <label class="choice"><input type="radio" name="q1" value="a"> To identify the message's topic or purpose</label>
  <label class="choice"><input type="radio" name="q1" value="b"> To replace the message body</label>
  <label class="choice"><input type="radio" name="q1" value="c"> To list every file on your computer</label></fieldset>
 <fieldset style="border:0;padding:0;margin:16px 0"><legend><strong>2. You mention an attachment. What should you do?</strong></legend>
  <label class="choice"><input type="radio" name="q2" value="a"> Assume it was added automatically</label>
  <label class="choice"><input type="radio" name="q2" value="b"> Verify that the correct file is attached</label>
  <label class="choice"><input type="radio" name="q2" value="c"> Send the email twice</label></fieldset>
 <fieldset style="border:0;padding:0;margin:16px 0"><legend><strong>3. What should you check before sending?</strong></legend>
  <label class="choice"><input type="radio" name="q3" value="a"> Only the font size</label>
  <label class="choice"><input type="radio" name="q3" value="b"> Only whether the Send button is visible</label>
  <label class="choice"><input type="radio" name="q3" value="c"> Recipient, subject, message, and relevant attachments</label></fieldset>
 <fieldset style="border:0;padding:0;margin:16px 0"><legend><strong>4. Where should exact mandatory formatting rules come from?</strong></legend>
  <label class="choice"><input type="radio" name="q4" value="a"> A guess based on another email application</label>
  <label class="choice"><input type="radio" name="q4" value="b"> The applicable technical manual or approved standard</label>
  <label class="choice"><input type="radio" name="q4" value="c"> A random example found online</label></fieldset>
 <button class="btn primary" type="submit">Submit answers</button>
</form>
<div id="assessmentFeedback" class="feedback" role="status" aria-live="polite"></div>`,
`<div class="eyebrow">10 · Completion</div>
<h1>You have completed the module</h1>
<p class="lead">You have explored the email interface, reviewed a sample, practised composing messages, and checked your understanding.</p>
<div class="cards">
 <div class="card"><strong>Before composing</strong><span>Know who needs the message and why you are sending it.</span></div>
 <div class="card"><strong>While composing</strong><span>Use a specific subject and a clear, complete message.</span></div>
 <div class="card"><strong>Before sending</strong><span>Verify the recipient, details, and any referenced attachments.</span></div>
</div>
<div class="note"><strong>Release note:</strong> The instructional flow is ready for review. The technical requirements, exact formatting rules, and any mandatory terminology still need validation against the source manual.</div>
<p id="finalScore" class="result"></p>
<button class="btn primary" id="restart">Restart module</button>`
];

let current = 0;
let assessmentScore = null;
const content = document.getElementById('screenContent');
const navButtons = Array.from(document.querySelectorAll('#screenNav button'));
const progress = document.getElementById('progress');
const counter = document.getElementById('screenCounter');

function showScreen(index){
 current = Math.max(0, Math.min(screens.length-1,index));
 content.innerHTML = screens[current];
 counter.textContent = `Screen ${current+1} of ${screens.length}`;
 progress.style.width = `${(current+1)/screens.length*100}%`;
 navButtons.forEach((b,i)=>{if(i===current)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
 wireScreen();
 content.focus({preventScroll:true});
 window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function addActions(){
 const bar=document.createElement('div'); bar.className='actions';
 const back=document.createElement('button'); back.className='btn'; back.textContent='Previous'; back.disabled=current===0; back.onclick=()=>showScreen(current-1);
 const next=document.createElement('button'); next.className='btn primary'; next.textContent=current===screens.length-1?'Back to start':'Continue'; next.onclick=()=>showScreen(current===screens.length-1?0:current+1);
 bar.append(back,next); content.append(bar);
}
function feedback(el,msg,good){el.textContent=msg;el.className=`feedback show ${good?'good':'bad'}`;}
function wireScreen(){
 if(current===1){
  const details={
   to:'Enter the intended recipient. Check the address and make sure the person belongs on the message.',
   subject:'Use a concise subject that helps the recipient recognise the topic or requested action.',
   body:'Write the message here. State the purpose clearly and include the details the recipient needs.',
   attachment:'Use this control to add a file when needed. Verify that the correct file is attached.',
   send:'Sending delivers the message to the listed recipients. Review the draft before selecting Send.'
  };
  content.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('click',()=>{
   content.querySelectorAll('[data-info]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
   const box=document.getElementById('interfaceInfo');box.textContent=details[b.dataset.info];box.className='note';
  }));
 }
 if(current===2){
  const steps=[
   {fields:[],body:'Start by identifying the intended recipient.'},
   {fields:[['To','alex.morgan@example.com']],body:'The recipient is set. Check the address before moving on.'},
   {fields:[['To','alex.morgan@example.com'],['Subject','Updated project schedule']],body:'The subject gives the reader a quick idea of the message topic.'},
   {fields:[['To','alex.morgan@example.com'],['Subject','Updated project schedule']],body:'Hello Alex,\\n\\nPlease review the updated project schedule and let me know if you have any questions.\\n\\nRegards,\\nSam'},
   {fields:[['To','alex.morgan@example.com'],['Subject','Updated project schedule']],body:'Hello Alex,\\n\\nPlease review the updated project schedule and let me know if you have any questions.\\n\\nRegards,\\nSam\\n\\nAttachment: Project_schedule.xlsx\\n\\nFinal check: confirm the recipient, content, and attachment before sending.'}
  ];let n=0;
  const render=()=>{document.getElementById('demoStep').textContent=`Step ${n+1} of ${steps.length}`;
   document.getElementById('demoFields').innerHTML=steps[n].fields.map(f=>`<div class="mail-row"><span class="mail-label">${f[0]}</span><span>${f[1]}</span></div>`).join('');
   document.getElementById('demoBody').textContent=steps[n].body;
   document.getElementById('demoBack').disabled=n===0;document.getElementById('demoNext').textContent=n===steps.length-1?'Restart demonstration':'Next step';
  };
  document.getElementById('demoBack').onclick=()=>{n=Math.max(0,n-1);render()};
  document.getElementById('demoNext').onclick=()=>{n=n===steps.length-1?0:n+1;render()};render();
 }
 if(current===3){
  const parts={
   recipient:'Check that the address belongs to the intended recipient. Avoid relying on a familiar display name alone.',
   subject:'A specific subject makes the topic easier to recognise and the message easier to find later.',
   body:'A useful message includes a greeting where appropriate, the purpose, the necessary details, and a suitable close.',
   attachment:'If the message refers to a file, confirm that the intended file is attached and is the correct version.'
  };
  content.querySelectorAll('[data-part]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('partInfo').textContent=parts[b.dataset.part]}));
 }
 if(current===4){
  document.getElementById('practiceForm').addEventListener('submit',e=>{
   e.preventDefault();
   const r=document.getElementById('recipient').value.trim(),s=document.getElementById('subject').value.trim(),m=document.getElementById('message').value.trim(),a=document.getElementById('attachment').value;
   let missing=[];if(!r)missing.push('recipient');if(r&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r))missing.push('a valid-looking email address');if(!s)missing.push('subject');if(!m)missing.push('message body');if(!a)missing.push('attachment status');
   const box=document.getElementById('practiceFeedback');
   if(missing.length)feedback(box,'Please review: '+missing.join(', ')+'.',false);
   else if(a==='forgotten')feedback(box,'Your draft has the core fields. Check the attachment status before sending; you selected “I have not checked.”',false);
   else feedback(box,'Good progress. Your core fields are present. Review the recipient and wording, and confirm that your attachment choice fits the scenario.',true);
  });
 }
 if(current===5){
  content.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{
   content.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
   const box=document.getElementById('errorFeedback');
   if(b.dataset.answer==='b')feedback(box,'Correct. Attach the intended report and verify it is present before sending. A sentence that mentions an attachment is not proof that the file was added.',true);
   else feedback(box,'Not quite. Pause and check the file before sending. The message should not promise an attachment that is missing.',false);
  }));
 }
 if(current===6){
  const boxes=Array.from(content.querySelectorAll('input[type=checkbox]'));
  const update=()=>{const n=boxes.filter(x=>x.checked).length;document.getElementById('checkProgress').textContent=`${n} of ${boxes.length} checks completed.`};
  boxes.forEach(x=>x.addEventListener('change',update));
 }
 if(current===7){
  document.getElementById('independentForm').addEventListener('submit',e=>{
   e.preventDefault();const s=document.getElementById('indSubject').value.trim(),m=document.getElementById('indBody').value.trim();
   const box=document.getElementById('indFeedback');const lower=m.toLowerCase();
   if(!s||!m){feedback(box,'Add both a subject and a message body before reviewing your draft.',false);return}
   const points=[];
   if(/draft guide|guide/.test(lower))points.push('mentions the draft guide');
   if(/review|feedback/.test(lower))points.push('asks for review or feedback');
   if(/friday/.test(lower))points.push('includes the Friday deadline');
   if(/http|drive|sharepoint|folder|path|location|stored|link/.test(lower))points.push('mentions a file location');
   const missing=[];if(!/draft guide|guide/.test(lower))missing.push('identify the draft guide');if(!/review|feedback/.test(lower))missing.push('ask for feedback');if(!/friday/.test(lower))missing.push('include the Friday deadline');if(!/http|drive|sharepoint|folder|path|location|stored|link/.test(lower))missing.push('state where the file is stored');
   if(missing.length)feedback(box,`Review your draft. It ${points.length?'already ':'still needs to '} ${points.join(', ')}${points.length?'. ':''}Consider adding: ${missing.join('; ')}.`,false);
   else feedback(box,'Your draft appears to cover the main scenario points: the guide, its location, a request for feedback, and the Friday deadline. Proofread for clarity and tone.',true);
  });
 }
 if(current===8){
  document.getElementById('assessmentForm').addEventListener('submit',e=>{
   e.preventDefault();const answers={q1:'a',q2:'b',q3:'c',q4:'b'};let score=0;
   Object.entries(answers).forEach(([q,a])=>{const picked=content.querySelector(`input[name="${q}"]:checked`);if(picked&&picked.value===a)score++});
   assessmentScore=score;const box=document.getElementById('assessmentFeedback');
   feedback(box,`Your score: ${score}/4. ${score>=3?'You have met the provisional pass mark.':'Review the feedback in the module, then try again.'}`,score>=3);
   let old=content.querySelector('#retryAssessment');if(!old){old=document.createElement('button');old.id='retryAssessment';old.className='btn';old.textContent='Try assessment again';old.onclick=()=>wireAssessmentReset();box.after(old)}
  });
 }
 if(current===9){
  document.getElementById('finalScore').textContent=assessmentScore===null?'Assessment not yet completed.':`Most recent assessment score: ${assessmentScore}/4.`;
  document.getElementById('restart').onclick=()=>{assessmentScore=null;showScreen(0)};
 }
 addActions();
}
function wireAssessmentReset(){
 const form=document.getElementById('assessmentForm');form.reset();const box=document.getElementById('assessmentFeedback');box.className='feedback';box.textContent='';
 const retry=document.getElementById('retryAssessment');if(retry)retry.remove();
}
navButtons.forEach(b=>b.addEventListener('click',()=>showScreen(Number(b.dataset.screen))));
showScreen(0);
})();
</script>
</body>
</html>
